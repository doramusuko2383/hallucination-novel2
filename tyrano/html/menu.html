<div id="menu_menu_wrapper" class="suspense_menu_screen">
    <button type="button" class="menu_close suspense_close">× CLOSE</button>

    <nav class="suspense_menu_nav" aria-label="Game menu">
        <button type="button" class="menu_item menu_save suspense_menu_button">SAVE</button>
        <button type="button" class="menu_item menu_load suspense_menu_button">LOAD</button>
        <button type="button" class="menu_item menu_backlog suspense_menu_button">BACKLOG</button>
        <button type="button" class="menu_item menu_config suspense_menu_button">CONFIG</button>
        <button type="button" class="menu_item menu_window_close suspense_menu_button">HIDE MESSAGE</button>
        <button type="button" class="menu_item menu_skip suspense_menu_button">SKIP</button>
        <button type="button" class="menu_item menu_auto suspense_menu_button">AUTO</button>
        <button type="button" class="menu_item menu_back_title suspense_menu_button">TITLE</button>
    </nav>

    <script>
        $("#menu_menu_wrapper .menu_auto").on("click", (e) => {
            TYRANO.kag.layer.getMenuLayer().empty().hide();
            if (TYRANO.kag.stat.visible_menu_button == 1) $(".button_menu").show();
            TYRANO.kag.key_mouse.auto();
            e.stopPropagation();
        });
        $("#menu_menu_wrapper .menu_backlog").on("click", (e) => {
            TYRANO.kag.layer.getMenuLayer().empty().hide();
            if (TYRANO.kag.stat.visible_menu_button == 1) $(".button_menu").show();
            TYRANO.kag.key_mouse.backlog();
            e.stopPropagation();
        });
        $("#menu_menu_wrapper .menu_config").on("click", (e) => {
            TYRANO.kag.layer.getMenuLayer().empty().hide();
            if (TYRANO.kag.stat.visible_menu_button == 1) $(".button_menu").show();
            TYRANO.kag.ftag.startTag("sleepgame", { storage: "config.ks" });
            e.stopPropagation();
        });
    </script>
</div>
